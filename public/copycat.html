<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}} — Copycat Eye</title>
<meta name="description" content="Spot memecoins that copy an older token's name or image, and the deployers who recycle them.">
<meta property="og:title" content="{{APP_NAME}} — Copycat Eye">
<meta property="og:description" content="{{APP_TAGLINE}}">
<meta property="og:url" content="{{CANONICAL}}">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&family=Funnel+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
{{THEME_STYLE}}
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap">
<header class="top"></header>
<main style="display: contents">

<section class="hero">
  <div>
    <span class="eyebrow">Copycat Eye</span>
    <h1 class="display">Old face, new contract.</h1>
  </div>
  <form id="scan-form" class="panel panel-sm" role="search" novalidate style="flex: 0 1 480px; min-width: min(280px, 100%)">
    <label for="ca" style="font-size: 13px; font-weight: 600">Token contract address</label>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16 16"/></svg>
      <input id="ca" name="address" type="text" placeholder="0x…" autocomplete="off" spellcheck="false">
    </div>
    <span class="form-error" id="scan-error" role="alert"></span>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <button type="button" class="btn" id="latest-btn" style="min-height: 44px; padding: 0 18px">Latest launch</button>
      <button type="submit" class="btn btn-primary">Scan token</button>
    </div>
  </form>
</section>

<div id="result" aria-live="polite" style="display: flex; flex-direction: column; gap: 32px">
  <div class="skel" style="min-height: 360px"></div>
</div>

</main>
<footer class="foot"></footer>
</div>
<script type="module" src="/assets/copycat.js"></script>
</body>
</html>
